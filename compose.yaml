
services:
  gateway:
    build:
      context: ../touringgo-gateway/src/TouringGo.Gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - usuarios-api
      - lugares-api
      - itinerarios-api

  usuarios-api:
    build:
      context: ../touringgo-usuarios
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=usuarios-db;Port=5432;Database=usuarios_db;Username=postgres;Password=postgres"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TouringGo.Usuarios
      Jwt__Audience: TouringGo
      Jwt__ExpirationMinutes: "60"
      ASPNETCORE_ENVIRONMENT: Development
      Frontend__BaseUrl: "${FRONTEND_BASE_URL:-http://localhost:5173}"
      
    depends_on:
      usuarios-db:
        condition: service_healthy

  usuarios-db:
    image: postgres:16
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - usuarios-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "15431:5432"


  lugares-api:
    build:
      context: ../touringgo-lugares
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=lugares-db;Port=5432;Database=lugares_db;Username=postgres;Password=postgres"
      Embeddings__BaseUrl: "http://embeddings-api:8000"
    depends_on:
      lugares-db:
        condition: service_healthy
      embeddings-api:
        condition: service_healthy

  lugares-db:
    build:
      context: ../touringgo-lugares
      dockerfile: Dockerfile.postgres
    image: touringgo-lugares-db:dev
    environment:
      POSTGRES_DB: lugares_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - lugares-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lugares_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "15432:5432"


  itinerarios-api:
    build:
      context: ../touringgo-itinerarios
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=itinerarios-db;Port=5432;Database=itinerarios_db;Username=postgres;Password=postgres"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TouringGo.Usuarios
      Jwt__Audience: TouringGo
      Lugares__BaseUrl: "http://lugares-api:8080"
      Ollama__BaseUrl: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      Ollama__Model: "${OLLAMA_MODEL:-llama3.2}"
    depends_on:
      itinerarios-db:
        condition: service_healthy

  itinerarios-db:
    image: postgres:16
    environment:
      POSTGRES_DB: itinerarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - itinerarios-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itinerarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "15433:5432"

  embeddings-api:
    build:
      context: ../touringgo-embeddings
      dockerfile: Dockerfile
    environment:
      HF_HOME: /models/huggingface
    volumes:
      - embeddings-model-cache:/models
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    ports:
      - "8084:8000"

  frontend:
    build:
      context: ../touringgo-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  usuarios-data:
  lugares-data:
  itinerarios-data:
  embeddings-model-cache: